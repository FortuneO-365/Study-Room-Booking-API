openapi: 3.0.3
info:
  title: Study Room Booking API
  version: 1.0.0
  description: |
    Lets students find and book study rooms, and stops two groups booking the same room at the same time.

    **Authentication:** protected endpoints need a JWT in the header `Authorization: Bearer <token>`.
    Get a token from `POST /api/auth/register` or `POST /api/auth/login`.

    **Responses:** successful responses are wrapped as `{ "success": true, "result": ... }`.
    Errors use `{ "error": { "code", "message", "details" } }`.

    **Times:** all date-times are ISO 8601 in UTC, for example `2030-06-03T09:00:00Z`.
    Opening hours are applied in the building's time zone, set by the server.
  contact:
    name: Study Room Booking API
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://study-room-booking-api-mtoh.onrender.com
    description: Deployed on Render 

tags:
  - name: Health
  - name: Auth
  - name: Rooms
  - name: Bookings

paths:
  /health:
    get:
      tags: [Health]
      summary: Check the service is running
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a student account
      description: |
        Public. Always creates a student. The client cannot choose a role; any `role` field is ignored.
        Emails are trimmed and lower-cased before they are stored.
        Limited to 20 requests per 15 minutes per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ada Okafor
              email: ada@student.example.edu
              password: at-least-8-characters
      responses:
        '201':
          description: Account created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_TAKEN
                  message: A user already exists with this email
                  details: []
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      description: |
        Public. The same error is returned for an unknown email and a wrong password,
        so the response does not reveal which emails are registered.
        Limited to 20 requests per 15 minutes per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: student@test.local
              password: Student123
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/rooms:
    get:
      tags: [Rooms]
      summary: List active rooms
      description: |
        Any logged-in user. Inactive rooms are never listed.
        Results are sorted by room name and paginated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: minCapacity
          in: query
          description: Only return rooms that hold at least this many people
          schema:
            type: integer
            minimum: 1
          example: 8
      responses:
        '200':
          description: A page of active rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Rooms]
      summary: Create a room
      description: Admin only. The request field is `name`; the stored and returned field is `roomName`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
            example:
              name: Library L2-07
              capacity: 12
              amenities: [whiteboard, screen]
              isActive: true
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RoomNameTaken'

  /api/rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Get one room
      description: |
        Any logged-in user. Students get a 404 for inactive rooms, the same as for rooms that do not exist.
        Admins can see inactive rooms.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rooms]
      summary: Update a room
      description: |
        Admin only. Send only the fields to change. Fields not sent are left as they are.
        At least one field is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
            example:
              capacity: 15
              isActive: false
      responses:
        '200':
          description: The updated room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RoomNameTaken'
    delete:
      tags: [Rooms]
      summary: Delete a room
      description: |
        Admin only. Refused while the room has upcoming confirmed bookings; deactivate it with
        `PATCH` (`isActive: false`) instead. Cancelled bookings do not block deletion.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Room deleted. No response body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The room has upcoming confirmed bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ROOM_HAS_BOOKINGS
                  message: This room has upcoming bookings. Deactivate it instead of deleting it.
                  details: []

  /api/rooms/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [Rooms]
      summary: Free and booked 30-minute slots for one day
      description: |
        Any logged-in user. Returns the opening-hours window for the date as 30-minute slots.
        A slot is unavailable if a confirmed booking overlaps it, or if it has already started.
        Cancelled bookings do not block a slot. The default day has 28 slots (08:00 to 22:00 local time).
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: The date in the building's local time, in the format YYYY-MM-DD
          schema:
            type: string
            format: date
          example: '2030-06-03'
      responses:
        '200':
          description: Slots for the day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/booking:
    post:
      tags: [Bookings]
      summary: Book a room
      description: |
        Any logged-in user. The booking is confirmed straight away if all rules pass:

        - the start time is in the future
        - the room exists and is active
        - the group fits the room's capacity
        - the time is within opening hours (building time zone)
        - the booking is 30 minutes to 4 hours long, starting and ending on :00 or :30
        - the student has fewer than 3 future confirmed bookings
        - no confirmed booking for the room overlaps the time (back-to-back bookings are allowed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            example:
              roomId: 64f1a2b3c4d5e6f7a8b9c0d1
              startTime: '2030-06-03T09:00:00Z'
              endTime: '2030-06-03T10:00:00Z'
              attendeeCount: 4
              purpose: Group project
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: |
            Validation failed, or a booking rule was broken. Possible codes: `VALIDATION_ERROR`,
            `OUTSIDE_OPENING_HOURS`, `BOOKING_LIMIT_REACHED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BookingConflict'

  /api/booking/me:
    get:
      tags: [Bookings]
      summary: List my bookings
      description: Bookings belonging to the logged-in user, newest start time first. Paginated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, cancelled]
        - name: upcoming
          in: query
          description: Use `true` to return only bookings that have not started yet. Any other value is rejected.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: A page of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/booking/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/BookingId'
    patch:
      tags: [Bookings]
      summary: Cancel a booking
      description: |
        The booking's owner, or an admin, can cancel. A booking can be cancelled only before it starts,
        and only once. The slot becomes available again straight away. No request body.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The cancelled booking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '400':
          description: |
            Invalid booking id (`VALIDATION_ERROR`), or the booking has already started (`BOOKING_ALREADY_STARTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The booking is already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: BOOKING_ALREADY_CANCELLED
                  message: This booking is already cancelled.
                  details: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomId:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal room id
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: 64f1a2b3c4d5e6f7a8b9c0d1
    BookingId:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal booking id
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page, from 1 to 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              example: BOOKING_CONFLICT
            message:
              type: string
            details:
              type: array
              description: Field-level problems for validation errors. Empty otherwise.
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    Meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 3

    User:
      type: object
      description: The account details returned after registering or logging in. Never includes the password or its hash.
      properties:
        id:
          type: string
          example: 64f0a1b2c3d4e5f6a7b8c9d0
        name:
          type: string
          example: Ada Okafor
        email:
          type: string
          format: email
          example: ada@student.example.edu
        role:
          type: string
          enum: [student, admin]
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Stored as a bcrypt hash. Anything sent in a `role` field is ignored.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    AuthResponse:
      type: object
      required: [success, result]
      properties:
        success:
          type: boolean
          example: true
        result:
          type: object
          required: [user, token]
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              description: JWT, valid for the time set by `JWT_EXPIRES_IN` (default 1 hour).

    CreateRoomRequest:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Stored as `roomName`
        capacity:
          type: integer
          minimum: 10
          maximum: 200
        amenities:
          type: array
          items:
            type: string
          default: []
        isActive:
          type: boolean
          default: true

    UpdateRoomRequest:
      type: object
      description: At least one field is required. Fields that are not sent are not changed.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 10
          maximum: 200
        amenities:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    Room:
      type: object
      properties:
        _id:
          type: string
          example: 64f1a2b3c4d5e6f7a8b9c0d1
        roomName:
          type: string
          example: Library L2-07
        capacity:
          type: integer
          example: 12
        amenities:
          type: array
          items:
            type: string
          example: [whiteboard, screen]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer
          description: Mongoose version key

    RoomResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          $ref: '#/components/schemas/Room'

    RoomListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Room'
            meta:
              $ref: '#/components/schemas/Meta'

    AvailabilityResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          type: object
          properties:
            roomId:
              type: string
            date:
              type: string
              format: date
              example: '2030-06-03'
            slots:
              type: array
              items:
                type: object
                properties:
                  start:
                    type: string
                    format: date-time
                    example: '2030-06-03T07:00:00.000Z'
                  end:
                    type: string
                    format: date-time
                    example: '2030-06-03T07:30:00.000Z'
                  available:
                    type: boolean

    CreateBookingRequest:
      type: object
      required: [roomId, startTime, endTime, attendeeCount]
      properties:
        roomId:
          type: string
          pattern: '^[a-fA-F0-9]{24}$'
        startTime:
          type: string
          format: date-time
          description: ISO 8601 in UTC. Must be on :00 or :30.
        endTime:
          type: string
          format: date-time
          description: ISO 8601 in UTC. Must be on :00 or :30, and 30 minutes to 4 hours after startTime.
        attendeeCount:
          type: integer
          minimum: 1
          description: Must not exceed the room's capacity
        purpose:
          type: string
          maxLength: 200

    Booking:
      type: object
      properties:
        _id:
          type: string
          example: 64f2c3d4e5f6a7b8c9d0e1f2
        userId:
          type: string
        roomId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        attendeeCount:
          type: integer
        purpose:
          type: string
        status:
          type: string
          enum: [confirmed, cancelled]
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        __v:
          type: integer

    BookingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          $ref: '#/components/schemas/Booking'

    BookingListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        result:
          type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Booking'
            meta:
              $ref: '#/components/schemas/Meta'

  responses:
    ValidationError:
      description: |
        The request is invalid. Use `details` to find the field. Malformed JSON returns `INVALID_JSON`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request.
              details:
                - field: capacity
                  message: "Too small: expected number to be >=10"
    Unauthorized:
      description: No token, an invalid token, or an expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Log in to continue.
              details: []
    InvalidCredentials:
      description: Wrong email or password. The message is the same for both.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid email or password.
              details: []
    Forbidden:
      description: Logged in, but this role is not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to do this.
              details: []
    NotFound:
      description: The resource does not exist, or is hidden from this user (for example an inactive room for a student)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Room not found.
              details: []
    RoomNameTaken:
      description: Another room already has this name
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: ROOM_NAME_TAKEN
              message: A room with this name already exists.
              details: []
    BookingConflict:
      description: The requested time overlaps a confirmed booking for this room
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BOOKING_CONFLICT
              message: The requested time overlaps an existing booking.
              details: []
    BodyTooLarge:
      description: The request body is over the size limit (100 KB)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: More than 20 login or register attempts in 15 minutes from this IP address
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Too many attempts. Please try again later.
              details: []